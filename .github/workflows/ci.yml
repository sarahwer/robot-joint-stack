name: CI

on:
  push:
  pull_request:

jobs:
  host-tests:
    name: Host unit tests (ASan + UBSan)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install tools
        run: sudo apt-get update && sudo apt-get install -y ninja-build
      - name: Configure
        run: cmake --preset host-tests
      - name: Build
        run: cmake --build --preset host-tests
      - name: Test
        run: ctest --preset host-tests

  static-analysis:
    name: Static analysis (cppcheck)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install cppcheck
        run: sudo apt-get update && sudo apt-get install -y cppcheck
      - name: cppcheck
        run: >
          cppcheck --enable=warning,style,performance,portability --std=c11
          --error-exitcode=1 --inline-suppr --quiet
          -I common/hal/include -I common/protocol/include
          -I common/node/include -I common/joint/include
          common app/joint_node

  firmware:
    name: Firmware ${{ matrix.preset }}
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        preset: [h7s3l8-node1, h7s3l8-node2]
    steps:
      - uses: actions/checkout@v4
      - name: Install Arm toolchain
        run: sudo apt-get update && sudo apt-get install -y ninja-build gcc-arm-none-eabi libnewlib-arm-none-eabi
      - name: Cache third-party sources
        uses: actions/cache@v4
        with:
          path: third_party
          key: third-party-${{ hashFiles('scripts/fetch_deps.sh') }}
      - name: Fetch dependencies
        run: ./scripts/fetch_deps.sh
      - name: Configure
        run: cmake --preset ${{ matrix.preset }}
      - name: Build
        run: cmake --build --preset ${{ matrix.preset }}
      - name: Upload firmware
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.preset }}
          path: |
            build/${{ matrix.preset }}/boards/nucleo_h7s3l8/*.elf
            build/${{ matrix.preset }}/boards/nucleo_h7s3l8/*.hex
            build/${{ matrix.preset }}/boards/nucleo_h7s3l8/*.map
